global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gold-market-api'
    static_configs:
      - targets:
          - 'mlops-goldmarket-api-service-1:8000'
          - 'mlops-goldmarket-api-service-2:8000'
          - 'mlops-goldmarket-api-service-3:8000'
    metrics_path: /metrics

  - job_name: 'drift-metrics'
    static_configs:
      - targets: ['localhost:9100']
    metrics_path: /metrics/drift.prom