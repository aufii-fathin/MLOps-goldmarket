apiVersion: 1

groups:
  - orgId: 1
    name: gold_market_ct_triggers
    folder: CT Alerts
    interval: 1m
    rules:

      - uid: high-latency-rule
        title: HighInferenceLatency
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: histogram_quantile(0.95, rate(inference_latency_seconds_bucket[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: classic_conditions
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: [2.0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
        for: 2m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "P95 latency melebihi 2s"
        notification_settings:
          receiver: github-ct-trigger

      - uid: data-drift-rule
        title: DataDriftDetected
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: gold_drift_detected
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: classic_conditions
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "Data drift terdeteksi"
        notification_settings:
          receiver: github-ct-trigger