name: Daily Data Ingestion & Drift Detection

on:
  schedule:
    - cron: '0 17 * * *'

  workflow_dispatch:

jobs:
  ingest-and-detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MLFLOW_TRACKING_URI: https://dagshub.com/aufii-fathin/MLOps-goldmarket.mlflow
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install "dvc[http]" dagshub scipy

      - name: Configure DVC Remote
        run: |
          dvc remote modify origin auth basic
          dvc remote modify origin user ${{ secrets.DAGSHUB_USER }}
          dvc remote modify origin password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull Data dari DagsHub
        run: dvc pull

      - name: Fetch & Preprocess Data Terbaru
        run: python src/data/data_pipeline.py

      - name: Push Updated Data ke DagsHub
        run: |
          dvc add data/raw data/processed
          dvc push
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add data/raw.dvc data/processed.dvc
          git diff --staged --quiet || git commit -m "ci: update data [skip ci]"
          git push

      - name: Detect Data Drift
        run: |
          python src/monitoring/drift_detector.py
          cat models/drift_report.json