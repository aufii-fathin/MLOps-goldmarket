services:

  api-service:
    build: .
    ports:
      - "8000-8002:8000"
    environment:
      MLFLOW_TRACKING_URI: https://dagshub.com/aufii-fathin/MLOps-goldmarket.mlflow
      MLFLOW_TRACKING_USERNAME: aufii-fathin
      MLFLOW_TRACKING_PASSWORD: b0815f5526a09cd2bf06c4324766bd8655aec0ed
    networks:
      - ml-network
    deploy:
      replicas: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ml-network
    depends_on:
      - api-service

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GITHUB_PAT=${GITHUB_PAT}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - ml-network
    depends_on:
      - prometheus

  webhook-relay:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./webhook_relay.py:/app/webhook_relay.py
    command: bash -c "pip install fastapi uvicorn httpx -q && uvicorn webhook_relay:app --host 0.0.0.0 --port 9095"
    environment:
      - GITHUB_PAT=${GITHUB_PAT}
    networks:
      - ml-network
    ports:
      - "9095:9095"

networks:
  ml-network:
    driver: bridge

volumes:
  grafana_data: