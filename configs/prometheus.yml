global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'gold-market-api'
    static_configs:
      - targets:
          - 'mlops-goldmarket-api-service-1:8000'
          - 'mlops-goldmarket-api-service-2:8000'
          - 'mlops-goldmarket-api-service-3:8000'
    metrics_path: /metrics