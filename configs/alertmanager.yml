global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  receiver: 'github-webhook'
  routes:
    - match:
        trigger: retraining
      receiver: 'github-webhook'

receivers:
  - name: 'github-webhook'
    webhook_configs:
      - url: 'http://localhost:9093/api/v2/alerts'
        send_resolved: false