groups:
  - name: gold_market_ct_triggers
    interval: 30s
    rules:

      - alert: HighInferenceLatency
        expr: histogram_quantile(0.95, rate(inference_latency_seconds_bucket[5m])) > 2.0
        for: 2m
        labels:
          severity: warning
          trigger: retraining
        annotations:
          summary: "P95 latency melebihi 2s"
          description: "Indikasi model decay — latency={{ $value }}s"

      - alert: PredictionAnomaly
        expr: abs(prediction_h1 - 4500) > 1000
        for: 5m
        labels:
          severity: critical
          trigger: retraining
        annotations:
          summary: "Nilai prediksi H1 anomali"
          description: "prediction_h1={{ $value }}, kemungkinan data drift"