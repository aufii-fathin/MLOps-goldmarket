models:
  - horizon_days: 1
    name: gold-close-model-h1
    alias: production
  - horizon_days: 3
    name: gold-close-model-h3
    alias: production
  - horizon_days: 5
    name: gold-close-model-h5
    alias: production
  - horizon_days: 7
    name: gold-close-model-h7
    alias: production

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: gold-close-forecast

data:
  raw_path: data/raw
  processed_path: data/processed

dvc:
  tracked_files:
    - raw.dvc
    - processed.dvc

description: >
  Multi-horizon gold Close forecasting models are registered per horizon
  (+1, +3, +5, +7 days). Each horizon can be promoted independently based
  on walk-forward validation results and comparison against a naive baseline.