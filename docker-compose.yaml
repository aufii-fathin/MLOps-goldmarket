services:

  api-service:
    build: .
    ports:
      - "8000-8002:8000"
    environment:
      MLFLOW_TRACKING_URI: https://dagshub.com/aufii-fathin/MLOps-goldmarket.mlflow
      MLFLOW_TRACKING_USERNAME: aufii-fathin
      MLFLOW_TRACKING_PASSWORD: b0815f5526a09cd2bf06c4324766bd8655aec0ed
    networks:
      - ml-network
    deploy:
      replicas: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./configs/alert_rules.yml:/etc/prometheus/alert_rules.yml
    networks:
      - ml-network
    depends_on:
      - api-service

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ml-network
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - ml-network
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'

networks:
  ml-network:
    driver: bridge

volumes:
  grafana_data: