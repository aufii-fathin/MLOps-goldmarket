name: Continuous Training Pipeline

on:
  schedule:
    - cron: '0 17 * * 0'

  repository_dispatch:
    types: [retraining-triggered]

  workflow_dispatch:
    inputs:
      reason:
        description: 'Alasan trigger manual'
        default: 'manual-simulation'

jobs:
  continuous-training:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: https://dagshub.com/aufii-fathin/MLOps-goldmarket.mlflow
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install "dvc[http]" dagshub scipy

      - name: Configure DVC Remote
        run: |
          dvc remote modify origin auth basic
          dvc remote modify origin user ${{ secrets.DAGSHUB_USER }}
          dvc remote modify origin password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull Data Terbaru dari DagsHub
        run: dvc pull

      - name: Detect Data Drift
        run: |
          python src/monitoring/drift_detector.py
          cat models/drift_report.json

      - name: Retrain Model
        run: python src/models/train.py

      - name: Evaluate Model Performance
        run: python src/models/evaluate.py

      - name: Compare & Promote Model
        run: python src/registry/transition_stage.py