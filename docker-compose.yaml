services:

  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ml-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow-server:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    command: >
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow_db
      --default-artifact-root /workspaces/MLOps-goldmarket/mlruns
      --host 0.0.0.0
      --allowed-hosts "*"
    environment:
      - MLFLOW_FLASK_SERVER_SECRET_KEY=supersecretkey
    volumes:
      - mlflow_data:/mlflow/artifacts
      - /workspaces/MLOps-goldmarket/mlruns:/workspaces/MLOps-goldmarket/mlruns
    networks:
      - ml-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-service:
    build: .
    depends_on:
      mlflow-server:
        condition: service_healthy
    ports:
      - "8000-8002:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MLFLOW_HOST: mlflow-server
    networks:
      - ml-network
    volumes:
      - /workspaces/MLOps-goldmarket/mlruns:/workspaces/MLOps-goldmarket/mlruns
    deploy:
      replicas: 3

  prometheus:
      image: prom/prometheus:latest
      container_name: prometheus
      ports:
        - "9090:9090"
      volumes:
        - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      networks:
        - ml-network
      depends_on:
        - api-service

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ml-network
    depends_on:
      - prometheus

networks:
  ml-network:
    driver: bridge

volumes:
  postgres_data:
  mlflow_data:
  grafana_data: